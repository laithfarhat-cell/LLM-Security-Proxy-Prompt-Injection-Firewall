services:
  mock-upstream:
    build: .
    command: uvicorn mock_upstream:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

  llm-firewall:
    build: .
    ports:
      - "8000:8000"
    environment:
      - UPSTREAM_URL=http://mock-upstream:8001/v1/chat/completions
    depends_on:
      - mock-upstream
